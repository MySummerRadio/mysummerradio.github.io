media:
  - name: images
    input: src/assets/images
    output: "@assets/images"
    rename: safe
  - name: gallery
    input: src/assets/gallery
    output: "@assets/gallery"
    rename: safe
content:
  - name: posts
    label: Blog
    type: collection
    path: src/content/blog
    fields:
      - name: title
        type: string
      - name: pubDate
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: published
        type: boolean
        default: true
      - name: description
        type: string
      - name: tags
        type: string
        list: true
      - name: body
        type: rich-text
    view:
      fields: [title, pubDate, published]
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
  - name: sidebars
    label: Sidebars
    type: group
    items:
      - name: left
        label: Left
        type: file
        path: src/content/sidebar-left.yaml
        fields:
          - name: title
            type: string
          - name: sections
            label: Sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading} ({index})"
            fields:
              - name: heading
                type: string
              - name: text
                type: rich-text
      - name: right
        label: Right
        type: file
        path: src/content/sidebar-right.yaml
        fields:
          - name: title
            type: string
          - name: sections
            label: Sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading} ({index})"
            fields:
              - name: heading
                type: string
              - name: text
                type: rich-text
  - name: gallery
    label: Gallery
    type: file
    path: src/pages/gallery.md
    fields:
      - name: title
        type: string
      - name: images
        type: object
        list: true
        fields:
          - name: image
            type: image
            options:
              media: gallery
              path: src/assets/gallery
              rename: safe
          - name: caption
            type: string
      - name: body
        type: rich-text
  - name: about
    label: À propos
    type: file
    path: src/pages/about.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "chore(create): {path}"
      update: "chore(update): {path}"
      delete: "chore(delete): {path}"
      rename: "chore(rename): {oldPath} -> {newPath}"
